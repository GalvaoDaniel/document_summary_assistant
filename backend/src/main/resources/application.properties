spring.application.name=document-summary-assistant-backend

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.profiles.active=local


spring.cloud.aws.region.static=us-east-1

aws.s3.endpoint=http://localhost:4566
aws.s3.region=us-east-1
aws.s3.bucket=my-bucket

# Credentials for LocalStack (it doesn't check credentials)
aws.s3.access-key=test
aws.s3.secret-key=test


#Spring Ai Configuration
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-sonnet-4-5
spring.ai.anthropic.chat.options.max-tokens=1024


app.upload-dir=./uploads/